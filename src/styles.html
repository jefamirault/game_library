  <style>
    :root {
      --bg: #11131a;
      --panel: #1b1e29;
      --panel-2: #232735;
      --text: #e7e9f0;
      --muted: #9aa0b4;
      --accent: #6c8cff;
      --accent-ink: #fff;
      --border: #2c3142;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #161925, #11131a);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .title { display: flex; align-items: baseline; gap: 12px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .2px; }
    .count { color: var(--muted); font-size: 13px; }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    input[type="search"], select, button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 14px;
      outline: none;
    }
    input[type="search"] { flex: 1 1 240px; min-width: 180px; }
    input[type="search"]:focus, select:focus, button:focus { border-color: var(--accent); }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    main { padding: 16px 20px 60px; max-width: 1100px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cover {
      height: 180px;
      margin: -14px -15px 2px;
      border-radius: 12px 12px 0 0;
      background: var(--panel-2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .cover img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .cover.none { color: var(--muted); font-size: 12px; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
    .card h3 { margin: 0; font-size: 15px; line-height: 1.3; word-break: break-word; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.console { color: var(--text); border-color: var(--accent); }
    button.badge.console { font-family: inherit; line-height: inherit; }
    button.badge.console:hover { filter: brightness(1.25); }
    .notes { color: var(--muted); font-size: 13px; }
    .byline { color: var(--muted); font-size: 13px; margin-top: -4px; }
    .card h3 button { all: unset; cursor: pointer; }
    .card h3 button:hover,
    .card:has(.cover[data-details]:hover) h3 button { color: var(--accent); }
    .card h3 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .cover[data-details] { cursor: pointer; }

    dialog {
      width: min(680px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      padding: 0;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: auto;
    }
    dialog::backdrop { background: rgba(5, 6, 10, 0.72); }
    /* Pop in from slightly below and smaller; closing (see closeDetails) reverses it. */
    dialog[open] { animation: dialog-in .24s cubic-bezier(.2, .9, .3, 1.15); }
    dialog[open]::backdrop { animation: backdrop-in .24s ease-out; }
    dialog.closing { animation: dialog-out .16s ease-in forwards; }
    dialog.closing::backdrop { animation: backdrop-out .16s ease-in forwards; }
    @keyframes dialog-in {
      from { opacity: 0; transform: translateY(16px) scale(.96); }
    }
    @keyframes dialog-out {
      to { opacity: 0; transform: translateY(8px) scale(.97); }
    }
    @keyframes backdrop-in { from { opacity: 0; } }
    @keyframes backdrop-out { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      @keyframes dialog-in { from { opacity: 0; } }
      @keyframes dialog-out { to { opacity: 0; } }
    }
    .detail { display: flex; flex-direction: column; }
    .detail-top { display: flex; gap: 18px; padding: 20px 20px 0; }
    .detail-cover {
      flex: 0 0 150px;
      height: 150px;
      background: var(--panel-2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
    }
    .detail-cover img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .detail-head { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .detail-head h2 { margin: 0; font-size: 20px; line-height: 1.25; padding-right: 28px; }
    .facts {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 3px 12px;
      margin: 4px 0 0;
      font-size: 13px;
    }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; }
    .detail-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
    .detail-body p { margin: 0; }
    .detail-body h4 {
      margin: 0 0 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
    }
    .credits { margin: 0; padding: 0; list-style: none; font-size: 14px; }
    .credits li { padding: 2px 0; }
    .credits .role { color: var(--muted); }
    .close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      padding: 0;
      line-height: 1;
      font-size: 18px;
    }
    @media (max-width: 520px) {
      .detail-top { flex-direction: column; align-items: center; text-align: center; }
      .detail-head .meta { justify-content: center; }
      .facts { text-align: left; }
      .detail-head h2 { padding: 0 28px; }
    }
    .spacer { flex: 1; }
    .download {
      display: inline-block;
      text-align: center;
      text-decoration: none;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .download:hover { filter: brightness(1.08); }
    .help { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .help details { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
    .help summary { cursor: pointer; }
    .help code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; color: var(--text); white-space: nowrap; }
    .help table { border-collapse: collapse; margin: 6px 0; }
    .help td { padding: 3px 12px 3px 0; vertical-align: top; }
    .help p { margin: 6px 0; }
    .state { color: var(--muted); padding: 40px 0; text-align: center; }
    .error { color: #ff8a8a; }
    a.plain { color: var(--accent); }
    .links { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; font-size: 13px; }
    .links a { color: var(--muted); text-decoration: none; }
    .links a:hover { color: var(--accent); }
    .links button { padding: 5px 10px; font-size: 13px; }
    @media (max-width: 520px) { .links { margin-left: 0; } .title { flex-wrap: wrap; } }
    .cover-upload { margin-top: 8px; padding: 6px 10px; font-size: 13px; width: 150px; }
    .cover-col { flex: 0 0 auto; width: 150px; display: flex; flex-direction: column; }
    .cover-col .detail-cover { flex: 0 0 150px; width: 150px; }
    .upload-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .upload-body h2 { margin: 0; font-size: 20px; padding-right: 28px; }
    .upload-body p { margin: 0; }
    .upload-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .upload-item .file { grid-column: 1 / -1; font-size: 13px; color: var(--muted); word-break: break-all; }
    .upload-item label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
    .upload-item input { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 14px; }
    .upload-item progress { grid-column: 1 / -1; width: 100%; height: 6px; accent-color: var(--accent); }
    .upload-item .status { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
    .upload-item .status.warn { color: #ffcf7a; }
    .upload-item .status.error { color: #ff8a8a; }
    .upload-item .status.done { color: #8fe3a4; }
    @media (max-width: 520px) { .upload-item { grid-template-columns: 1fr; } }
    .upload-actions { display: flex; gap: 10px; justify-content: flex-end; }
    button.download { border: 0; }
    .detail-actions { display: flex; gap: 10px; }
    .detail-actions .download { flex: 1; }
    button.delete { color: #ff8a8a; border-color: #5a2d35; background: transparent; }
    button.delete:hover { border-color: #ff8a8a; background: rgba(255, 138, 138, .08); }
    button.delete:disabled { opacity: .5; cursor: default; }
    button.download:disabled { opacity: .5; cursor: default; }
    .upload-body h4 {
      margin: 0 0 6px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
    }
    .upload-body .notes { margin: 6px 0 0; }
    .field-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .field-row input { flex: 1 1 220px; min-width: 0; }
    /* :where() keeps these easy to override (e.g. .upload-item input). */
    :where(input[type="text"], input[type="email"], input[type="url"]) {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 14px;
      outline: none;
    }
    :where(input[type="text"], input[type="email"], input[type="url"]):focus { border-color: var(--accent); }
    .status { font-size: 13px; color: var(--muted); white-space: pre-line; }
    .status:empty { display: none; }
    .status.done { color: #8fe3a4; }
    .status.error { color: #ff8a8a; }
  </style>
